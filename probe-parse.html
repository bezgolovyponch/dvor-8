<!doctype html><meta charset="utf-8"><title>parse</title>
<style>body{margin:0;background:#101014;color:#eee;font:13px/1.4 system-ui}
canvas{display:block;image-rendering:pixelated;width:288px;height:512px;float:left;margin:8px;border:1px solid #444}
#stats{padding:8px;white-space:pre;font-family:ui-monospace,monospace}</style>
<canvas id="src" width="288" height="512"></canvas>
<canvas id="vis" width="288" height="512"></canvas>
<div id="stats">loading…</div>
<script>
// EVERY FAILURE IS SHOWN. A probe that can hang in silence is worse than no probe: this prints the error, the stage
// it happened at, and the timestamp, so the reason is never guessed.
window.addEventListener('error', (e) => { document.getElementById('stats').textContent = 'ERROR at ' + new Date().toISOString() + '\n' + (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || ''); });
window.addEventListener('unhandledrejection', (e) => { document.getElementById('stats').textContent = 'REJECTED at ' + new Date().toISOString() + '\n' + String((e.reason && e.reason.stack) || e.reason); });
</script>
<script type="module">
import { sceneParse } from './src/scene-parse.js';
const stats = document.getElementById('stats');
stats.textContent = 'module loaded ' + new Date().toISOString() + '\n';
const img = new Image();
stats.textContent += 'fetching the photograph…\n';
img.src = 'photos-test/v10a.jpg';
try { await img.decode(); } catch (e) { stats.textContent += 'DECODE FAILED ' + e.message; throw e; }
stats.textContent += 'photograph decoded ' + img.naturalWidth + 'x' + img.naturalHeight + '\n';
const w = 288, h = 512;
const sc = document.getElementById('src').getContext('2d');
sc.drawImage(img, 0, 0, w, h);
const t0 = performance.now();
stats.textContent += 'running the parse…\n';
let parse = null;
try { parse = await sceneParse(img, w, h, img.naturalWidth, img.naturalHeight); }
catch (e) { stats.textContent += 'PARSE THREW ' + ((e && e.stack) || e); throw e; }
const ms = Math.round(performance.now() - t0);
if (!parse) { stats.textContent = 'PARSE FAILED\n' + (window.__parseError || 'no error recorded'); document.title = 'FAILED'; }
else {
  const cols = { sky: '#4d9be8', building: '#e04f78', road: '#8a93a6', car: '#ffd23f', vegetation: '#5fbf6a', person: '#ffffff', sidewalk: '#b98a5a', wall: '#a04fd0', terrain: '#7a6a4a' };
  const vc = document.getElementById('vis').getContext('2d');
  const out = vc.createImageData(w, h);
  for (let p = 0; p < w * h; p += 1) {
    let col = [30, 30, 34];
    for (const k of Object.keys(cols)) { const m = parse.masks[k]; if (m && m[p]) { col = [parseInt(cols[k].slice(1,3),16), parseInt(cols[k].slice(3,5),16), parseInt(cols[k].slice(5,7),16)]; break; } }
    out.data[p*4] = col[0]; out.data[p*4+1] = col[1]; out.data[p*4+2] = col[2]; out.data[p*4+3] = 255;
  }
  vc.putImageData(out, 0, 0);
  const area = (k) => { const m = parse.masks[k]; if (!m) return '—'; let n = 0; for (let p = 0; p < w*h; p += 1) if (m[p]) n += 1; return (100*n/(w*h)).toFixed(1) + '%'; };
  const hs = [...parse.horizon].sort((a,b)=>a-b);
  stats.textContent = 'PARSE OK in ' + ms + ' ms · classes ' + parse.classes + ' · ' + Object.keys(parse.masks).join(',') + '\n'
    + 'sky ' + area('sky') + ' · building ' + area('building') + ' · road ' + area('road')
    + ' · car ' + area('car') + ' · vegetation ' + area('vegetation') + ' · person ' + area('person')
    + ' · sidewalk ' + area('sidewalk') + '\n'
    + 'horizon (sky class lower boundary): median row ' + hs[Math.floor(hs.length/2)] + ' of ' + h
    + ' · min ' + hs[0] + ' · max ' + hs[hs.length-1];
  document.title = 'PARSE OK ' + ms + 'ms';
}
window.__parse = parse;
</script>
