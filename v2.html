<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ДВОР-8 · v2</title>
<style>
  :root { --panel: color-mix(in oklab, var(--night), var(--ink) 14%); --scrim: color-mix(in oklab, var(--night) 82%, transparent); --edge: 2px solid var(--outline); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--ink); font: 13px/1.3 ui-monospace, Menlo, monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #hud { width: min(100vw, 56vh); display: flex; justify-content: space-between; padding: 8px 12px; letter-spacing: 1px; }
  #hud b { color: var(--gold); }
  #stage { width: min(100vw, 56vh); overflow: hidden; border: 3px solid var(--outline); outline: 2px solid var(--hot); }
  #screen { display: block; width: 100%; image-rendering: pixelated; touch-action: none; }
  #bar { width: min(100vw, 56vh); display: flex; gap: 8px; padding: 10px 12px; }
  button, label { flex: 1; background: var(--panel); color: var(--ink); border: var(--edge); box-shadow: 3px 3px 0 var(--hot); padding: 10px 6px; font: inherit; font-weight: 700; text-align: center; }
  input[type=file] { display: none; }
  #stage { position: relative; }
  #refimg { position: absolute; inset: 0; width: 100%; image-rendering: pixelated; }
  #pickbar { width: min(100vw, 56vh); padding: 0 12px; }
  #photo { width: 100%; background: var(--panel); color: var(--ink); border: var(--edge); padding: 10px; font: inherit; font-weight: 700; }
  #note { padding: 4px 12px; opacity: 0.8; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--scrim); text-align: center; padding: 16px; }
  #end[hidden] { display: none; }
  #end .t { color: var(--hot); font-weight: 700; letter-spacing: 2px; }
  #end .s { color: var(--gold); font-size: 40px; font-weight: 700; }
  #end button { flex: none; padding: 10px 24px; }
</style>
</head>
<body>
<div id="hud"><span>ОЧКИ <b id="score">000000</b></span><span>КОМБО <b id="combo">–</b></span><span>КАМНИ <b id="throws">–</b></span><span>МАШИНЫ <b id="left">–</b></span></div>
<div id="stage"><canvas id="screen" width="288" height="512"></canvas><img id="refimg" hidden alt="эталон v13"><div id="end" hidden><div class="t">РАУНД ОКОНЧЕН</div><div id="endscore" class="s">0</div><div id="endstats"></div><button id="again">ЕЩЁ РАЗ</button></div></div>
<div id="bar">
  <button id="weapon">КАМЕНЬ</button>
  <label>СНИМОК<input id="file" type="file" accept="image/*"></label>
  <button id="view">СЛОИ</button>
  <button id="ref" hidden>ЭТАЛОН</button>
</div>
<div id="pickbar"><select id="photo" aria-label="снимок"></select></div>
<div id="note">загрузка…</div>
<script type="module" src="src/v2/game.js"></script>
</body>
</html>
